defaults: ../../grpo_math_1B.yaml

grpo:
  num_prompts_per_step: 1
  num_generations_per_prompt: 2
  max_num_steps: 1
  val_at_start: false
  val_at_end: false
  val_period: 1
  max_val_samples: 8
  val_batch_size: 8

checkpointing:
  enabled: true
  checkpoint_dir: results/grpo-minimax-m2.7-1n1g-fsdp2-lora-smoke
  save_period: 1
  save_optimizer: true
  keep_top_k: 2

policy:
  model_name: tiny-random/minimax-m2.7
  tokenizer:
    name: ${policy.model_name}
  train_global_batch_size: 2
  train_micro_batch_size: 1
  generation_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 512
  precision: bfloat16
  hf_config_overrides:
    use_mtp: false
  dtensor_cfg:
    _v2: true
    enabled: true
    tensor_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: false
    activation_checkpointing: true
    automodel_kwargs:
      force_hf: true
    lora_cfg:
      enabled: true
      target_modules:
        - q_proj
        - k_proj
        - v_proj
        - o_proj
      match_all_linear: false
      dim: 16
      alpha: 32
      dropout: 0.0
      use_triton: false
  sequence_packing:
    enabled: false
  dynamic_batching:
    enabled: false
  generation:
    backend: vllm
    max_new_tokens: 128
    temperature: 1.0
    top_p: 0.95
    top_k: 40
    vllm_cfg:
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.5
      max_model_len: 512
      enforce_eager: true

logger:
  log_dir: logs/grpo-minimax-m2.7-1n1g-fsdp2-lora-smoke
  wandb_enabled: false
  tensorboard_enabled: false
  monitor_gpus: false
  wandb:
    project: nemo-rl
    name: grpo-minimax-m2.7-1n1g-fsdp2-lora-smoke

cluster:
  gpus_per_node: 1
  num_nodes: 1
