defaults: ../../grpo_math_1B.yaml

grpo:
  max_num_steps: 1
  num_prompts_per_step: 1
  num_generations_per_prompt: 2
  val_at_start: false
  val_at_end: false
  val_period: 0

checkpointing:
  enabled: true
  checkpoint_dir: results/grpo-qwen3-8b-base-1n2g-megatron-lora-smoke
  save_period: 1
  save_optimizer: true
  keep_top_k: 2

policy:
  model_name: Qwen/Qwen3-8B-Base
  train_global_batch_size: 2
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 1024
  precision: bfloat16

  dtensor_cfg:
    enabled: false

  megatron_cfg:
    enabled: true
    tensor_model_parallel_size: 1
    expert_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: false
    activation_checkpointing: true
    # Override grpo_math_1B.yaml default (true) — v0.5.0 image rejects
    # `freeze_moe_router=true` combined with PEFT. Qwen3-8B-Base is dense
    # so freezing the MoE router is moot anyway.
    freeze_moe_router: false

  sequence_packing:
    enabled: false

  generation:
    vllm_cfg:
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.4
      max_model_len: 1024
      enforce_eager: true

logger:
  log_dir: logs/grpo-qwen3-8b-base-1n2g-megatron-lora-smoke
  wandb_enabled: false
  tensorboard_enabled: false
  monitor_gpus: false

cluster:
  gpus_per_node: 1
  num_nodes: 1
