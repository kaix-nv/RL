defaults: ../../dpo.yaml

dpo:
  max_num_steps: 1
  val_period: 0
  val_at_start: false
  val_at_end: false
  reference_policy_kl_penalty: 0.05

checkpointing:
  enabled: true
  checkpoint_dir: results/dpo-minimax-m2.7-1n1g-fsdp2-lora-smoke
  save_period: 1
  save_optimizer: true
  keep_top_k: 2

policy:
  model_name: tiny-random/minimax-m2.7
  tokenizer:
    name: ${policy.model_name}
  train_global_batch_size: 2
  train_micro_batch_size: 1
  max_total_sequence_length: 512
  precision: bfloat16
  hf_config_overrides:
    use_mtp: false

  dtensor_cfg:
    _v2: true
    enabled: true
    tensor_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: false
    activation_checkpointing: true
    automodel_kwargs:
      force_hf: true
    lora_cfg:
      enabled: true
      target_modules:
        - q_proj
        - k_proj
        - v_proj
        - o_proj
      match_all_linear: false
      dim: 16
      alpha: 32
      dropout: 0.0
      use_triton: false

  sequence_packing:
    enabled: false
  dynamic_batching:
    enabled: false

logger:
  log_dir: logs/dpo-minimax-m2.7-1n1g-fsdp2-lora-smoke
  wandb_enabled: false
  tensorboard_enabled: false
  monitor_gpus: false

cluster:
  gpus_per_node: 1
  num_nodes: 1
